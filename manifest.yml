modules:
  jira:customFieldType:
    - key: traffic-light-field
      name: Traffic Light Field
      description: Custom field that displays a traffic light with configurable labels.
      type: string
      contextConfig:
        resource: main
        layout: basic
      edit:
        resource: edit
        experience:
          - issue-create
          - issue-transition
          - issue-view
          - portal-request
        validation:
          expression: value == null || ['none','red','yellow','green'].includes(value)
          errorMessage: Invalid traffic light value
      view:
        resource: view
        render: native
        experience:
          - issue-view
          - portal-view
        formatter:
          expression: |-
            // Emoji-Triade pro Wert
            let v = value ?? 'none';
            let emoji = v === 'red' ? '🔴⚪️⚪️'
                      : v === 'yellow' ? '⚪️🟡⚪️'
                      : v === 'green' ? '⚪️⚪️🟢'
                      : '⚪️⚪️⚪️';
            // Label aus der Context-Config
            let label = v === 'red' ? (configuration?.redLabel || '')
                       : v === 'yellow' ? (configuration?.yellowLabel || '')
                       : v === 'green' ? (configuration?.greenLabel || '')
                       : (configuration?.noneLabel || '');
            `${emoji}${label ? ' ' + label : ''}`
          export: true
      searchSuggestions:
        expression: '["none","red","yellow","green"]'
resources:
  - key: main
    path: static/configurable-validation/build
  - key: edit
    path: static/edit/build
  - key: view
    path: static/view/build
permissions:
  content:
    styles:
      - unsafe-inline
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/a9095b11-0814-4217-8cdb-e69ddfe50973
